[package]
name = "rdvhome"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
futures-util = "0.3"
hkdf = "0.12"
include_dir = "0.7"
mdns-sd = "0.13"
num-bigint = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

x25519-dalek = { version = "2", features = ["static_secrets"] }
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "arm", target_arch = "aarch64")))'.dependencies]
rppal = "0.22"

[profile.release]
strip = true
lto = "thin"
