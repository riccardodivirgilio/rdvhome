[package]
name = "rdvhome"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
futures-util = "0.3"
include_dir = "0.7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "fs"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "arm", target_arch = "aarch64")))'.dependencies]
rppal = "0.22"

[profile.release]
strip = true
lto = "thin"
