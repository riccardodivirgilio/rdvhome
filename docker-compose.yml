# The app running against mock servers, so nothing touches the real lights.
# The mocks emulate the devices from the responses captured by mock-capture.py
# (see mock-*/captures): state in memory, auth ignored, any token works.
# The captures are not in git: create them once with `python3 mock-capture.py`
# (GETs and no-op writes on the real devices), without them the mocks start empty.
#
#   docker compose up --build     # python app on http://localhost:8500, rust app on :8501
#   python3 mock-test.py          # checks the mocks (philips :8580, nanoleaf :16021)
#   uv run parity.py              # checks that the rust app answers like the python one
#   uv run homekit-test.py        # checks that the rust app takes over the HomeKit pairing of the python one
#
# The rust app (rdvhome-rs) has its own pair of mocks: with shared ones the hue
# poller of one app would see what the other app wrote.

services:
  app:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    command: uv run --no-project --with-requirements rdvhome/requirements.txt python run.py run
    environment:
      RDV_PHILIPS_GATEWAY_HOST: mock-philips
      RDV_NANOLEAF_PC_HOST: mock-nanoleaf
      RDV_NANOLEAF_EXA_HOST: mock-nanoleaf
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      # not the data folder of the repo: parity.py wipes it
      - app-data:/app/rdvhome/data
      - uv-cache:/root/.cache/uv
    ports:
      - "8500:8500"
    depends_on:
      - mock-philips
      - mock-nanoleaf

  app-rs:
    build:
      context: ./rdvhome-rs
      additional_contexts:
        frontend: ./rdvhome/frontend/dist
    environment:
      RDV_PHILIPS_GATEWAY_HOST: mock-philips-rs
      RDV_NANOLEAF_PC_HOST: mock-nanoleaf-rs
      RDV_NANOLEAF_EXA_HOST: mock-nanoleaf-rs
    volumes:
      - app-rs-data:/data
    ports:
      - "8501:8500"
    depends_on:
      - mock-philips-rs
      - mock-nanoleaf-rs

  # a HomeKit controller inside the network (mdns works between the containers),
  # started by homekit-test.py
  homekit-test:
    profiles: [test]
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    volumes:
      - .:/work
      - uv-cache:/root/.cache/uv

  mock-philips:
    build: ./mock-philips
    volumes:
      - ./mock-philips/captures:/app/captures:ro
    environment:
      PORT: "80"
    ports:
      - "8580:80"

  mock-nanoleaf:
    build: ./mock-nanoleaf
    volumes:
      - ./mock-nanoleaf/captures:/app/captures:ro
    environment:
      PORT: "16021"
    ports:
      - "16021:16021"

  mock-philips-rs:
    build: ./mock-philips
    volumes:
      - ./mock-philips/captures:/app/captures:ro
    environment:
      PORT: "80"
    ports:
      - "8581:80"

  mock-nanoleaf-rs:
    build: ./mock-nanoleaf
    volumes:
      - ./mock-nanoleaf/captures:/app/captures:ro
    environment:
      PORT: "16021"
    ports:
      - "16022:16021"

volumes:
  uv-cache:
  app-data:
  app-rs-data:
